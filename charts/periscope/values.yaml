replicaCount: 1

image:
  repository: ghcr.io/jdmldm1/periscope
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""

service:
  type: NodePort
  port: 3001
  targetPort: 3001
  nodePort: 30080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: true
  capabilities:
    drop:
      - ALL
    add:
      - NET_RAW

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 5Gi

hostMounts:
  hostPath: ""
  mountPath: ""

auth:
  apiKey: ""
  enabled: true

airgap: false
airgapLite: false

scanning:
  enabled: true

retina:
  enabled: true
  image:
    repository: ghcr.io/microsoft/retina/retina-agent
    tag: v0.0.2
    pullPolicy: IfNotPresent
  metricsPort: 10093
  metricsIntervalSeconds: 10
  plugins:
    - dropreason
    - packetforward
    - linuxutil
