sonar.host.url=http://localhost:9000
sonar.projectKey=periscope-kubernetes
sonar.projectName=Periscope Kubernetes Control Plane
sonar.projectVersion=1.3.7
sonar.sources=server.js,src,frontend/src
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.test.ts,**/*.test.js
sonar.tests=.
sonar.test.inclusions=server.test.js,src/**/*.test.js,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/tests/**/*.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info,frontend/coverage/lcov.info
sonar.sourceEncoding=UTF-8
